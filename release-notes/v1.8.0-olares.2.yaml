date: August 6, 2026

# Olares fork: beclab/envoy-gateway on branch olares/v1.8.0-pki-100y.
# Includes 100-year certgen lifetime (from v1.8.0-olares.1) plus ExtAuth client redirect headers.
breaking changes: |
  Olares fork only: internal certgen default certificate lifetime is **36500 days** (100 years) instead of upstream 1825 days (5 years). No API or CRD changes.

security updates: |

new features: |
  Olares fork: 100-year default lifetime for control-plane certgen-issued mTLS certificates (see internal/crypto/certgen.go patch on olares/v1.8.0-pki-100y).

bug fixes: |
  HTTP ExtAuth: always set authorization_response.allowed_client_headers to include
  set-cookie, location, and www-authenticate so Authelia /api/verify unauthenticated
  302+Location reaches the browser (avoids Envoy synthesizing client 403).
  HTTP ExtAuth: always set authorization_request.headers_to_add with X-Forwarded-Method/
  Proto/Host/Uri/For (oes parity) so pathOverride checks keep the original client path
  in X-Forwarded-Uri (%REQ(:PATH)%).

